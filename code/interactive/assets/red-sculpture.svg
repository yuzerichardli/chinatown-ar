<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="t">
  <title id="t">Drawing of the red lattice sculpture on the Rose Kennedy Greenway</title>
  <!-- Flat illustration of the sculpture, simplified from a photo: a tall front
       frame, a lower back frame, crossbars that overhang the posts, and two
       diagonal beams joining the frames. -->
  <defs>
    <clipPath id="disc"><circle cx="320" cy="320" r="306"/></clipPath>
  </defs>
  <circle cx="320" cy="320" r="306" fill="#e3ecd6"/>
  <g clip-path="url(#disc)">
    <!-- soft tree shapes behind -->
    <circle cx="140" cy="250" r="110" fill="#cfdfbf"/>
    <circle cx="510" cy="230" r="120" fill="#cfdfbf"/>
    <circle cx="330" cy="170" r="90" fill="#d8e5c9"/>
    <!-- path / ground -->
    <path d="M-20 520 Q320 490 660 520 L660 660 L-20 660Z" fill="#d6d9cf"/>

    <g stroke-linecap="butt" fill="none">
      <!-- back frame -->
      <g stroke="#c0343f" stroke-width="9">
        <line x1="150" y1="236" x2="150" y2="505"/>
        <line x1="205" y1="222" x2="205" y2="500"/>
        <line x1="255" y1="210" x2="255" y2="496"/>
        <line x1="112" y1="262" x2="292" y2="248"/>
        <line x1="112" y1="390" x2="292" y2="380"/>
      </g>
      <!-- diagonal beams from the back frame up to the front frame -->
      <g stroke="#c8303a" stroke-width="10">
        <line x1="128" y1="250" x2="352" y2="112"/>
        <line x1="236" y1="300" x2="508" y2="140"/>
      </g>
      <!-- front frame -->
      <g stroke="#d42b35" stroke-width="14">
        <line x1="335" y1="96" x2="335" y2="525"/>
        <line x1="470" y1="112" x2="470" y2="540"/>
        <line x1="290" y1="150" x2="520" y2="164"/>
        <line x1="270" y1="422" x2="522" y2="416"/>
      </g>
      <!-- highlights -->
      <g stroke="#f07a78" stroke-width="3" opacity=".75">
        <line x1="331" y1="100" x2="331" y2="521"/>
        <line x1="466" y1="116" x2="466" y2="536"/>
      </g>
    </g>

    <!-- bamboo and shrubs around the base -->
    <path d="M90 530 Q110 450 135 500 Q155 430 180 495 Q205 445 225 500 Q250 420 280 505 Q300 465 320 520Z" fill="#94b872"/>
    <path d="M320 535 Q345 455 370 505 Q395 440 420 510 Q445 460 470 515 Q500 450 525 520 Q545 490 560 540Z" fill="#94b872"/>
    <path d="M30 560 Q90 500 160 535 Q230 495 300 545 Q370 505 440 548 Q510 510 610 560 L640 640 L0 640Z" fill="#729d55"/>
    <!-- stone edge in front -->
    <path d="M-10 590 Q320 548 650 585 L650 660 L-10 660Z" fill="#bcc0b6"/>
  </g>
</svg>
