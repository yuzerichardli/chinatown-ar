<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chinatown AR — Tai Chi</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- ============================================================
       8th Wall WebAR stack (open-source, 2026 — no app key needed)
       1) 8frame  : 8th Wall's A-Frame fork (vendored locally)
       2) xrextras: loading screen + error handling
       3) xr.js   : engine binary; SLAM via data-preload-chunks="slam"
                    (also registers the <a-scene xrweb> component)
       Runs in the browser on iPhone Safari + Android — NO app.
       ============================================================ -->
  <script src="./vendor/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
          crossorigin="anonymous"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
          crossorigin="anonymous" data-preload-chunks="slam"></script>

  <script src="./poses.js?v=12"></script>

  <style>
    #hint {
      position: fixed; left: 0; right: 0; bottom: 28px;
      text-align: center; pointer-events: none;
      font-family: -apple-system, system-ui, sans-serif;
      color: #fff; font-size: 16px; padding: 0 16px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }
    /* Transparent full-screen layer that catches taps to change pose. */
    #tapcatcher { position: fixed; inset: 0; z-index: 3; background: transparent; }
  </style>
</head>
<body>
  <a-scene
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true"
    xrweb="allowedDevices: any; scale: absolute">

    <!-- All three poses preloaded so switching is instant -->
    <a-assets>
      <a-asset-item id="pose0" src="../../model/masters/tai-chi-pose.glb"></a-asset-item>
      <a-asset-item id="pose1" src="../../model/masters/tai-chi-stance.glb"></a-asset-item>
      <a-asset-item id="pose2" src="../../model/masters/blue-clad.glb"></a-asset-item>
      <a-asset-item id="pose3" src="../../model/masters/prayer.glb"></a-asset-item>
    </a-assets>

    <!-- Camera-relative orbit rig. The master sits a fixed distance in front of
         you and faces you. Dragging spins this rig, so he travels around YOU on
         a circle (you are the center) rather than spinning on the spot; pinch
         zooms him. Because he's attached to the camera rig (not the room), he's
         rock-steady — no world-tracking drift. All three poses share the same
         spot; we toggle visibility so tapping swaps pose in place. -->
    <a-camera position="0 0 0">
      <a-entity id="orbitRig" rotation="0 0 0">
        <a-entity class="pose" id="poseEntity0" gltf-model="#pose0"
                  position="0 0 -2.5" rotation="0 0 0" scale="2.5 2.5 2.5"></a-entity>
        <a-entity class="pose" id="poseEntity1" gltf-model="#pose1"
                  position="0 0 -2.5" rotation="0 0 0" scale="2.5 2.5 2.5" visible="false"></a-entity>
        <a-entity class="pose" id="poseEntity2" gltf-model="#pose2"
                  position="0 0 -2.5" rotation="0 0 0" scale="2.5 2.5 2.5" visible="false"></a-entity>
        <a-entity class="pose" id="poseEntity3" gltf-model="#pose3"
                  position="0 0 -2.5" rotation="0 0 0" scale="2.5 2.5 2.5" visible="false"></a-entity>
      </a-entity>
    </a-camera>

    <a-light type="ambient" intensity="0.85"></a-light>
    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
  </a-scene>

  <div id="tapcatcher"></div>
  <div id="hint">Drag to move him around you · pinch to zoom · tap to change pose</div>
</body>
</html>
