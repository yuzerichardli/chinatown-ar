<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chinatown AR — Tai Chi</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- ============================================================
       8th Wall WebAR stack (open-source, 2026 — no app key needed)
       1) 8frame  : 8th Wall's A-Frame fork (vendored locally)
       2) xrextras: loading screen + error handling
       3) xr.js   : engine binary; SLAM via data-preload-chunks="slam"
                    (also registers the <a-scene xrweb> component)
       Runs in the browser on iPhone Safari + Android — NO app.
       ============================================================ -->
  <script src="./vendor/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
          crossorigin="anonymous"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
          crossorigin="anonymous" data-preload-chunks="slam"></script>

  <script src="./poses.js"></script>

  <style>
    #hint {
      position: fixed; left: 0; right: 0; bottom: 28px;
      text-align: center; pointer-events: none;
      font-family: -apple-system, system-ui, sans-serif;
      color: #fff; font-size: 16px; padding: 0 16px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }
    /* Transparent full-screen layer that catches taps to change pose. */
    #tapcatcher {
      position: fixed; inset: 0; z-index: 3; background: transparent;
    }
  </style>
</head>
<body>
  <a-scene
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true"
    xrweb="allowedDevices: any">

    <!-- The three poses, preloaded so swapping is instant -->
    <a-assets>
      <a-asset-item id="pose0" src="../../model/taichi.glb?v=3"></a-asset-item>
      <a-asset-item id="pose1" src="../../model/taichi2.glb?v=1"></a-asset-item>
      <a-asset-item id="pose2" src="../../model/taichi3.glb?v=1"></a-asset-item>
    </a-assets>

    <!-- Camera. The master is a CHILD of the camera, so it stays in front of
         you and facing you no matter how you move ("head-locked"). Tapping
         only swaps which pose model is shown — position/size never change.
         Tune POSITION / ROTATION / SCALE below if needed:
           position "0 -0.2 -2"  → x, up/down, distance-in-front
           rotation "0 0 0"      → set "0 180 0" if his back faces you
           scale    "3.4 ..."    → bigger/smaller -->
    <a-camera position="0 0 0">
      <a-entity
        id="master"
        gltf-model="#pose0"
        position="0 -0.2 -2"
        rotation="0 0 0"
        scale="3.4 3.4 3.4">
      </a-entity>
    </a-camera>

    <a-light type="ambient" intensity="0.85"></a-light>
    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
  </a-scene>

  <div id="tapcatcher"></div>
  <div id="hint">Tap anywhere to change pose</div>
</body>
</html>
