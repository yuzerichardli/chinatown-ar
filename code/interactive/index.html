<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chinatown AR — Interactive</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- ============================================================
       8th Wall WebAR stack (open-source, 2026 — no app key needed)
       1) 8frame  : 8th Wall's A-Frame fork (vendored locally so we
                    don't depend on the retiring old CDN)
       2) xrextras: loading screen, error handling, and the gesture
                    components (hold-drag, pinch-scale, rotate)
       3) xr.js   : the engine binary. SLAM world-tracking is loaded
                    via data-preload-chunks="slam" (REQUIRED). This
                    script also registers the A-Frame <a-scene xrweb>.
       Works in the browser on iPhone Safari + Android — NO app.
       ============================================================ -->
  <script src="./vendor/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
          crossorigin="anonymous"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
          crossorigin="anonymous" data-preload-chunks="slam"></script>

  <script src="./tap-place.js"></script>

  <style>
    #hint {
      position: fixed; left: 0; right: 0; bottom: 24px;
      text-align: center; pointer-events: none;
      font-family: -apple-system, system-ui, sans-serif;
      color: #fff; font-size: 15px; padding: 0 16px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <a-scene
    tap-place
    xrextras-gesture-detector
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true"
    xrweb="allowedDevices: any">

    <!-- The tai chi master, loaded from the shared model/ folder -->
    <a-assets>
      <a-asset-item id="taichiModel" src="../../model/taichi.glb?v=3"></a-asset-item>
    </a-assets>

    <!-- Camera raycasts against anything tagged .cantap (the ground) -->
    <a-camera
      id="camera"
      position="0 8 0"
      raycaster="objects: .cantap"
      cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <!-- Lighting + a soft shadow that tracks the scene -->
    <a-entity
      light="type: directional; intensity: 0.85; castShadow: true;
             shadowMapHeight: 2048; shadowMapWidth: 2048;
             shadowCameraTop: 20; shadowCameraBottom: -20;
             shadowCameraRight: 20; shadowCameraLeft: -20; target: #camera"
      position="1 4.3 2.5"
      shadow></a-entity>
    <a-light type="ambient" intensity="0.6"></a-light>

    <!-- Invisible ground plane: receives taps (to place) and shadows -->
    <a-entity
      id="ground"
      class="cantap"
      geometry="primitive: plane; height: 10000; width: 10000"
      rotation="-90 0 0"
      material="shader: shadow; transparent: true; opacity: 0.3"
      shadow="receive: true"></a-entity>
  </a-scene>

  <div id="hint">Tap the ground to place the master · drag to move · pinch to resize</div>
</body>
</html>
