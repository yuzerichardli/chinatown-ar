<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#843a2e">
  <meta name="description" content="Bring four dim sum dishes to a shared table in this simple Chinatown AR mini game.">
  <title>Dim Sum · Share the Table</title>
  <link rel="stylesheet" href="dimsum.css?v=5">
  <script src="game.js?v=4" defer></script>
  <script src="dimsum.js?v=5" defer></script>
</head>
<body>
  <video id="camera" autoplay muted playsinline aria-hidden="true"></video>
  <main>
    <section id="arrival" aria-labelledby="arrival-title">
      <img id="landmark" src="assets/180-cafe-sign.svg?v=1" alt="Drawing of the 180 Café sign with orange lettering and 面包工坊" draggable="false">
      <h1 id="arrival-title">Are you in front of the 180 cafe?</h1>
      <button id="arrive">Yes</button>
    </section>

    <section id="experience" hidden aria-label="Dim sum sharing">
      <div id="board" aria-label="Four dim sum dishes and a lazy Susan table">
        <div id="dishes"></div>
        <button id="shared-table" aria-label="Place the selected dish on the lazy Susan">
          <img id="table-surface" src="assets/lazy-susan.png" alt="" draggable="false">
          <img id="teapot" src="assets/teapot-3d.png" alt="" draggable="false">
          <span id="shared-dishes" aria-hidden="true"></span>
        </button>
      </div>

      <div class="controls">
        <p id="status" class="sr-only" role="status"></p>
        <button id="continue">Tap to continue<br><span lang="zh-Hans">轻触继续</span></button>
      </div>
    </section>

    <aside id="camera-controls" class="camera-controls">
      <button id="enable-camera" class="text-button">Enable camera · 开启相机</button>
      <p id="camera-status">You can also play without a camera.</p>
    </aside>

    <section id="reading" hidden aria-label="Dim sum story">
      <article id="page" tabindex="-1"></article>
      <nav aria-label="Story navigation">
        <button id="back" class="secondary">Back · 上一页</button>
        <button id="next">Next · 下一页</button>
      </nav>
    </section>
    <noscript>This mini game needs JavaScript. · 请开启 JavaScript 以体验互动游戏。</noscript>
  </main>
</body>
</html>
