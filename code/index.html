<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Chinatown AR</title>

  <!-- model-viewer: Google's free web component for showing 3D + AR.
       Loaded from a CDN, so there is nothing to install or build. -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    :root { --accent: #c8102e; }            /* a Chinatown red */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; }
    body { background: #111; color: #fff; overflow: hidden; }

    model-viewer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #2a2a2a, #111);
    }

    /* Loading bar shown while the model downloads */
    .progress-bar {
      position: absolute; top: 0; left: 0; height: 4px; width: 0%;
      background: var(--accent); transition: width 0.2s; z-index: 10;
    }

    /* The "View in AR" button model-viewer shows on AR-capable phones */
    .ar-button {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #fff; border: none;
      padding: 12px 22px; border-radius: 999px; font-size: 16px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4); z-index: 10;
    }

    /* Info card overlaid at the bottom */
    .card {
      position: fixed; left: 12px; right: 12px; bottom: 12px;
      background: rgba(20,20,20,0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 16px 18px; text-align: center; z-index: 10;
    }
    .card h1 { margin: 0 0 6px; font-size: 20px; }
    .card p  { margin: 0; font-size: 14px; opacity: 0.85; line-height: 1.4; }
    .hint { font-size: 12px; opacity: 0.55; margin-top: 8px; }
    .credit { font-size: 10px; opacity: 0.4; margin-top: 8px; }
  </style>
</head>
<body>
  <!-- The 3D viewer. src + text get filled in by the script below
       depending on which location's QR was scanned (?spot=...). -->
  <model-viewer
    id="viewer"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    touch-action="pan-y"
    autoplay
    shadow-intensity="1"
    exposure="1"
    alt="Chinatown AR character">

    <button slot="ar-button" class="ar-button">📷 View in AR</button>
    <div class="progress-bar" slot="progress-bar"></div>
  </model-viewer>

  <div class="card">
    <h1 id="title">Chinatown AR</h1>
    <p id="desc">Loading…</p>
    <div class="hint" id="hint">Tap "View in AR", point at the ground, and step back.</div>
    <div class="credit" id="credit"></div>
  </div>

  <script>
    /* ----------------------------------------------------------------
       LOCATIONS CONFIG
       Each Chinatown spot gets one entry here. The QR code for a spot
       points to this same page with ?spot=<key> on the end, e.g.
         https://YOURSITE/?spot=taichi
         https://YOURSITE/?spot=lion-dance
       To add a spot: drop its .glb in the ../model/ folder and add an entry.
       Model paths are relative to this file (code/), so they start with
       ../model/  to reach the model/ folder next door.
    ---------------------------------------------------------------- */
    const LOCATIONS = {
      taichi: {
        title: "Morning Tai Chi",
        desc: "Every morning, locals gather here to practice tai chi. Meet the master.",
        // Poses cycle in this order on each tap, then loop back to the first.
        poses: [
          "../model/taichi.glb?v=3",
          "../model/taichi2.glb?v=1",
          "../model/taichi3.glb?v=1",
        ],
        credit: "",   // e.g. "3D model by <artist name>" if a license requires it
      },
      // Example for your next spot — add the .glb(s) to ../model/ then uncomment:
      // "lion-dance": {
      //   title: "Lion Dance Corner",
      //   desc: "During festivals, the lion dance winds through these streets.",
      //   poses: ["../model/lion-dance.glb"],
      //   credit: "",
      // },
    };

    const params = new URLSearchParams(location.search);
    const key = params.get("spot");
    const spot = LOCATIONS[key] || LOCATIONS.taichi;   // default if no/unknown ?spot

    const viewer = document.getElementById("viewer");
    const hint = document.getElementById("hint");
    const bar = viewer.querySelector(".progress-bar");

    document.getElementById("title").textContent = spot.title;
    document.getElementById("desc").textContent = spot.desc;
    document.getElementById("credit").textContent = spot.credit || "";
    document.title = spot.title + " — Chinatown AR";

    // Support either a list of poses or a single model.
    const poses = spot.poses || [spot.model];
    let idx = 0;

    function updateHint() {
      hint.textContent = poses.length > 1
        ? `Pose ${idx + 1} / ${poses.length} — changing automatically · tap to skip · then “View in AR”.`
        : `Tap “View in AR”, point at the ground, and step back.`;
    }

    function loadPose(i) {
      idx = (i % poses.length + poses.length) % poses.length;  // wrap around
      bar.style.opacity = "1";
      bar.style.width = "0%";
      viewer.src = poses[idx];
      updateHint();
    }

    loadPose(0);  // show the first pose

    // Drive the loading bar while each model downloads.
    viewer.addEventListener("progress", (e) => {
      const pct = e.detail.totalProgress * 100;
      bar.style.width = pct + "%";
      bar.style.opacity = pct >= 100 ? "0" : "1";
    });

    // Tap the figure to advance to the next pose. We tell a quick tap apart from
    // a drag (which orbits the camera) so rotating the view doesn't change poses.
    // NOTE: this works in the on-screen 3D view only. Once "View in AR" hands off
    // to the phone's AR viewer, the pose can no longer be switched from here.
    let downX = 0, downY = 0, downT = 0, dragged = false;
    viewer.addEventListener("pointerdown", (e) => {
      downX = e.clientX; downY = e.clientY; downT = Date.now(); dragged = false;
    });
    viewer.addEventListener("pointermove", (e) => {
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > 10) dragged = true;
    });
    viewer.addEventListener("pointerup", (e) => {
      if (dragged || Date.now() - downT > 400) return;   // it was a drag / orbit
      if (e.target.closest(".ar-button")) return;        // let the AR button work
      if (poses.length > 1) { loadPose(idx + 1); startAuto(); }  // skip + reset timer
    });

    // Auto-advance through the poses every few seconds.
    // NOTE: this animates the on-screen 3D view only. Inside the phone's live AR
    // camera (Quick Look / Scene Viewer), the page can't swap models, so this
    // timer does not run there — for motion in AR you need a single ANIMATED model.
    const AUTO_MS = 4000;
    let timer = null;
    function startAuto() {
      stopAuto();
      if (poses.length > 1) timer = setInterval(() => loadPose(idx + 1), AUTO_MS);
    }
    function stopAuto() { if (timer) { clearInterval(timer); timer = null; } }
    startAuto();

    // Warm the browser cache so later poses appear instantly when cycled.
    poses.slice(1).forEach((u) => fetch(u).catch(() => {}));
  </script>
</body>
</html>
