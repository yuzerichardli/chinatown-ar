<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chinatown AR — Films at the Gate</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- 8th Wall WebAR stack (same as the tai-chi scene) -->
  <script src="./vendor/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
          crossorigin="anonymous"></script>
  <script async src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
          crossorigin="anonymous" data-preload-chunks="slam"></script>

  <script src="./screen.js?v=4"></script>

  <style>
    #hint {
      position: fixed; left: 0; right: 0; bottom: 28px; text-align: center;
      pointer-events: none; font-family: -apple-system, system-ui, sans-serif;
      color: #fff; font-size: 16px; padding: 0 16px; text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      z-index: 6;
    }
    #tapcatcher { position: fixed; inset: 0; z-index: 3; background: transparent; }
    /* Full-screen story view (pics 9 & 10): large, readable, taps pass through */
    #story {
      position: fixed; inset: 0; background: #000; display: none;
      z-index: 5; pointer-events: none;
    }
    #story img { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <a-scene
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement: true"
    xrweb="allowedDevices: any; scale: absolute">

    <a-assets>
      <a-asset-item id="screenModel" src="../../model/screen.glb?v=2"></a-asset-item>
      <img id="img0" src="pictures/pic01.jpg" crossorigin="anonymous">
      <img id="img1" src="pictures/pic02.jpg" crossorigin="anonymous">
      <img id="img2" src="pictures/pic03.jpg" crossorigin="anonymous">
      <img id="img3" src="pictures/pic04.jpg" crossorigin="anonymous">
      <img id="img4" src="pictures/pic05.jpg" crossorigin="anonymous">
      <img id="img5" src="pictures/pic06.jpg" crossorigin="anonymous">
      <img id="img6" src="pictures/pic07.jpg" crossorigin="anonymous">
      <img id="img7" src="pictures/pic08.jpg" crossorigin="anonymous">
      <img id="img8" src="pictures/pic09.jpg" crossorigin="anonymous">
      <img id="img9" src="pictures/pic10.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- The 3D movie-screen model + a photo plane sitting on its screen face,
         both inside one group so they move/zoom together. Camera-relative rig:
           drag  -> orbit around you,  pinch -> zoom,  tap -> next photo. -->
    <a-camera position="0 0 0">
      <a-entity id="orbitRig" rotation="0 0 0">
        <a-entity id="screenGroup" position="0 0 -3" scale="0.75 0.75 0.75">
          <!-- the cinema screen model -->
          <a-entity id="screenModel" gltf-model="#screenModel"></a-entity>
          <!-- the photo, covering the screen face (+Z), unlit. The picplane is
               sized to the full screen opening; screen.js cover-crops the photo
               so it fills edge-to-edge with no white border. -->
          <a-entity id="picplane"
                    position="0 0.06 0.09"
                    geometry="primitive: plane; width: 1.49; height: 1.05"
                    material="shader: flat; src: #img0; side: front"></a-entity>
        </a-entity>
      </a-entity>
    </a-camera>

    <a-light type="ambient" intensity="1.0"></a-light>
    <a-light type="directional" intensity="0.6" position="1 2 2"></a-light>
  </a-scene>

  <div id="story"><img id="storyimg" alt="story"></div>
  <div id="tapcatcher"></div>
  <div id="hint">Drag to move · pinch to zoom · tap for next scene</div>
</body>
</html>
